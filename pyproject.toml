[project]
name = "promptmaker"
version = "0.1.0"
description = "Model-aware prompt refinement tool for Claude Code users"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
keywords = ["claude", "claude-code", "prompt", "prompt-engineering", "mcp"]

[project.urls]
Repository = "https://github.com/Createyouracccount/PromptMaker"
Issues = "https://github.com/Createyouracccount/PromptMaker/issues"

[project.scripts]
promptmaker = "promptmaker.cli:main"
promptmaker-mcp = "promptmaker.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptmaker*"]

[tool.setuptools.package-data]
promptmaker = ["profiles/*.md", "profiles/condensed/*.md"]
